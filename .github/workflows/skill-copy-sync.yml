name: skill-copy-sync
on:
  pull_request:
    paths: ["SKILL.md", "references/**", "skills/**", ".github/workflows/skill-copy-sync.yml"]
  push:
    branches: [main]
    paths: ["SKILL.md", "references/**", "skills/**", ".github/workflows/skill-copy-sync.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Codex copy must match the root skill
        run: |
          diff -u SKILL.md skills/unpolish-ai-writing/SKILL.md
          diff -ru references skills/unpolish-ai-writing/references
